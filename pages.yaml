pages:
  - type: info
    title: "Willkommen beim QUIZZ Tool"
    text: "Dies ist ein Beispiel für eine Informationsseite. Auf der rechten Seite sehen Sie ein Bild, während dieser Text die linke Hälfte ausfüllt. Klicken Sie auf den Button, um fortzufahren."
    image: "/static/images/placeholder_info.png"

  - type: input
    title: "Bevor wir beginnen"
    text: "Bitte geben Sie Ihr Alter an, damit wir das Quiz für Sie anpassen können."
    label: "Wie alt sind Sie?"
    min: 1
    max: 120
    image: "/static/images/placeholder_info2.png"

  - type: quiz
    question: "Welches Bild zeigt die Farbe Rot?"
    image_left: "/static/images/placeholder_quiz1.png"
    image_right: "/static/images/placeholder_quiz2.png"
    answer_left: "Bild links"
    answer_right: "Bild rechts"
    correct_answer: "left"

  - type: quiz_feedback
    title_correct: "Richtig!"
    text_correct: "Sie haben die richtige Antwort gewählt."
    title_wrong: "Leider falsch"
    text_wrong: "Die richtige Antwort wäre 'Bild links' gewesen."
    image: "/static/images/placeholder_feedback.png"

  - type: info
    title: "Zusätzliche Information"
    text: "Hier ist eine weitere Informationsseite. Das System unterstützt beliebig viele Seiten in beliebiger Reihenfolge."
    image: "/static/images/placeholder_info2.png"

  - type: quiz
    save: true
    question: "Welches Bild zeigt Okker?"
    image_left: "/static/images/placeholder_quiz3.png"
    image_right: "/static/images/placeholder_quiz4.png"
    answer_left: "Bild links"
    answer_right: "Bild rechts"
    correct_answer: "right"

  - type: quiz
    save: true
    question: "Ist dies eine Katze?"
    image_left: "/static/images/placeholder_quiz1.png"
    answer_left: "Ja"
    answer_right: "Nein"
    correct_answer: "Ja"

  - type: info
    title: "Vielen Dank!"
    text: "Sie haben alle Fragen beantwortet. Ihre Antworten wurden gespeichert."
    image: "/static/images/placeholder_thanks.png"
