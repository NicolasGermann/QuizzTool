pages:
  - type: info
    title: "Farbe-Quiz"
    text: "Willkommen zum Farb-Quiz2! Testen Sie Ihr Wissen über verschiedene Farben. Sie werden Fragen zu verschiedenen Farben beantworten und erhalten anschließend Feedback zu Ihren Antworten."
    image: "/static/images/placeholder_info.png"

  - type: quiz
    question: "Welches dieser Farben ist Rot?"
    image_left: "/static/images/placeholder_quiz1.png"
    image_right: "/static/images/placeholder_quiz2.png"
    answer_left: "Farbe links"
    answer_right: "Farbe rechts"
    correct_answer: "left"

  - type: quiz_feedback
    title_correct: "Perfekt!"
    text_correct: "Richtig! Das linke Farbe ist tatsächlich Rot."
    title_wrong: "Nicht ganz"
    text_wrong: "Leider falsch. Das linke Farbe ist Grün."
    image: "/static/images/placeholder_feedback.png"

  - type: quiz
    question: "Welches Farbe ist Okker?"
    image_left: "/static/images/placeholder_quiz3.png"
    image_right: "/static/images/placeholder_quiz4.png"
    answer_left: "Farbe links"
    answer_right: "Farbe rechts"
    correct_answer: "right"

  - type: quiz_feedback
    title_correct: "Ausgezeichnet!"
    text_correct: "Korrekt!"
    title_wrong: "Leider nicht"
    text_wrong: "Das war nicht richtig!"
    image: "/static/images/placeholder_feedback2.png"

  - type: quiz
    question: "Ist dieses Farbe ein Rot?"
    image_left: "/static/images/placeholder_quiz1.png"
    answer_left: "Ja"
    answer_right: "Nein"
    correct_answer: "Ja"

  - type: quiz_feedback
    title_correct: "Stimmt genau!"
    text_correct: "Richtig!"
    title_wrong: "Nicht korrekt"
    text_wrong: "Leider falsch."
    image: "/static/images/placeholder_feedback.png"

  - type: info
    title: "Quiz abgeschlossen!"
    text: "Vielen Dank für Ihre Teilnahme am Farbe-Quiz! Ihre Antworten wurden gespeichert. Wir hoffen, es hat Ihnen Spaß gemacht."
    image: "/static/images/placeholder_thanks.png"
