{% extends "base.html" %}
{% block content %}
<style>
    .feedback-container {
        display: flex;
        min-height: 100vh;
    }
    .feedback-text {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 2rem;
        min-width: 0;
    }
    .feedback-text h1 { margin-bottom: 1rem; word-wrap: break-word; }
    .feedback-text p { font-size: 1.1rem; line-height: 1.6; margin-bottom: 2rem; white-space: pre-wrap; }
    .feedback-text .correct { color: #16a34a; }
    .feedback-text .wrong { color: #dc2626; }
    .feedback-image {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f4f6;
        padding: 1rem;
        min-width: 0;
    }
    .feedback-image img {
        max-width: 100%;
        max-height: 66.67vh;
        object-fit: contain;
    }
    @media (max-width: 768px), (max-aspect-ratio: 1/1) {
        .feedback-container { flex-direction: column; }
        .feedback-text { padding: 1.5rem; }
        .feedback-image { min-height: 40vh; }
    }
</style>
<div class="feedback-container">
    <div class="feedback-text">
        {% if is_correct %}
        <h1 class="correct">{{ page.title_correct }}</h1>
        <p>{{ page.text_correct }}</p>
        {% else %}
        <h1 class="wrong">{{ page.title_wrong }}</h1>
        <p>{{ page.text_wrong }}</p>
        {% endif %}
        {% if not is_last %}
        <a href="/page/{{ next_index }}" class="btn btn-primary">Weiter</a>
        {% endif %}
    </div>
    <div class="feedback-image">
        <img src="{{ page.image }}" alt="Feedback">
    </div>
</div>
{% endblock %}
