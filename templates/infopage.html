{% extends "base.html" %}
{% block content %}
<div style="display: flex; height: 100vh;">
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 2rem;">
        <h1 style="margin-bottom: 1rem;">{{ page.title }}</h1>
        <p style="font-size: 1.1rem; line-height: 1.6; margin-bottom: 2rem;">{{ page.text }}</p>
        {% if not is_last %}
        <a href="/page/{{ next_index }}" style="
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 0.375rem;
            font-size: 1rem;
            width: fit-content;
        ">Weiter</a>
        {% else %}
        <a href="/" style="
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #16a34a;
            color: white;
            text-decoration: none;
            border-radius: 0.375rem;
            font-size: 1rem;
            width: fit-content;
        ">Fertig</a>
        {% endif %}
    </div>
    <div style="flex: 1;">
        <img src="{{ page.image }}" alt="{{ page.title }}" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
</div>
{% endblock %}
