{% extends "base.html" %}
{% block content %}
<style>
    .info-container {
        display: flex;
        min-height: 100vh;
    }
    .info-text {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 2rem;
        min-width: 0;
    }
    .info-text h1 { margin-bottom: 1rem; word-wrap: break-word; }
    .info-text p { font-size: 1.1rem; line-height: 1.6; margin-bottom: 2rem; white-space: pre-wrap; }
    .info-text.full-width {
        max-width: 900px;
        margin: 0 auto;
    }
    .info-image {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f4f6;
        padding: 1rem;
        min-width: 0;
    }
    .info-image img {
        max-width: 100%;
        max-height: 66.67vh;
        object-fit: contain;
    }
    @media (max-width: 768px), (max-aspect-ratio: 1/1) {
        .info-container { flex-direction: column; }
        .info-text { padding: 1.5rem; }
        .info-image { min-height: 40vh; }
    }
</style>
<div class="info-container">
    <div class="info-text{% if not page.image %} full-width{% endif %}">
        <h1>{{ page.title }}</h1>
        <p>{{ page.text }}</p>
        {% if not is_last %}
        <a href="/page/{{ next_index }}" class="btn btn-primary">Weiter</a>
        {% endif %}
    </div>
    {% if page.image %}
    <div class="info-image">
        <img src="{{ page.image }}" alt="{{ page.title }}">
    </div>
    {% endif %}
</div>
{% endblock %}
