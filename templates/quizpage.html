{% extends "base.html" %}
{% block content %}
<div style="display: flex; flex-direction: column; height: 100vh;">
    <div style="flex: 1; display: flex;">
        <div style="flex: 1; padding: 1rem;">
            <img src="{{ page.image_left }}" alt="Option A" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <div style="flex: 1; padding: 1rem;">
            <img src="{{ page.image_right }}" alt="Option B" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem;">
        <h2 style="margin-bottom: 2rem;">{{ page.question }}</h2>
        <div style="display: flex; gap: 2rem;">
            <form hx-post="/answer/{{ page_index }}" hx-swap="none" style="display: inline;">
                <input type="hidden" name="answer" value="left">
                <button type="submit" style="
                    padding: 1rem 2rem;
                    font-size: 1.1rem;
                    background: #2563eb;
                    color: white;
                    border: none;
                    border-radius: 0.375rem;
                    cursor: pointer;
                ">{{ page.answer_left }}</button>
            </form>
            <form hx-post="/answer/{{ page_index }}" hx-swap="none" style="display: inline;">
                <input type="hidden" name="answer" value="right">
                <button type="submit" style="
                    padding: 1rem 2rem;
                    font-size: 1.1rem;
                    background: #2563eb;
                    color: white;
                    border: none;
                    border-radius: 0.375rem;
                    cursor: pointer;
                ">{{ page.answer_right }}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
