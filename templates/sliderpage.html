{% extends "base.html" %}
{% block content %}
<style>
    .slider-container {
        display: flex;
        min-height: 100vh;
    }
    .slider-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 2rem;
        min-width: 0;
    }
    .slider-content h1 { margin-bottom: 1rem; word-wrap: break-word; }
    .slider-content p { font-size: 1.1rem; line-height: 1.6; margin-bottom: 2rem; white-space: pre-wrap; }
    .slider-form {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        max-width: 500px;
    }
    .slider-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .slider-group label {
        font-size: 1rem;
        font-weight: 500;
    }
    .slider-group input[type="range"] {
        width: 100%;
        height: 8px;
        border-radius: 4px;
        background: #d1d5db;
        outline: none;
        -webkit-appearance: none;
    }
    .slider-group input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #2563eb;
        cursor: pointer;
    }
    .slider-group input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #2563eb;
        cursor: pointer;
        border: none;
    }
    .slider-value {
        font-size: 1.1rem;
        font-weight: 600;
        color: #2563eb;
    }
    .slider-form button {
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 0.375rem;
        cursor: pointer;
        width: fit-content;
        margin-top: 1rem;
    }
    .slider-form button:hover {
        background: #1d4ed8;
    }
    .slider-image {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f4f6;
        padding: 1rem;
        min-width: 0;
    }
    .slider-image img {
        max-width: 100%;
        max-height: 66.67vh;
        object-fit: contain;
    }
    @media (max-width: 768px), (max-aspect-ratio: 1/1) {
        .slider-container { flex-direction: column; }
        .slider-content { padding: 1.5rem; }
        .slider-image { min-height: 40vh; }
        .slider-form { max-width: 100%; }
    }
</style>
<div class="slider-container">
    <div class="slider-content">
        <h1>{{ page.title }}</h1>
        <p>{{ page.text }}</p>
        <form class="slider-form" hx-post="/answer/{{ page_index }}" hx-swap="none">
            {% for slider in page.sliders %}
            <div class="slider-group">
                <label for="slider_{{ loop.index0 }}">{{ slider.label }}</label>
                <input 
                    type="range" 
                    id="slider_{{ loop.index0 }}" 
                    name="slider_{{ loop.index0 }}"
                    min="{{ slider.min }}"
                    max="{{ slider.max }}"
                    value="{{ slider.min }}"
                    oninput="document.getElementById('value_{{ loop.index0 }}').textContent = this.value"
                >
                <span class="slider-value" id="value_{{ loop.index0 }}">{{ slider.min }}</span>
            </div>
            {% endfor %}
            {% if not is_last %}
            <button type="submit">Weiter</button>
            {% endif %}
        </form>
    </div>
    {% if page.image %}
    <div class="slider-image">
        <img src="{{ page.image }}" alt="{{ page.title }}">
    </div>
    {% endif %}
</div>
{% endblock %}
